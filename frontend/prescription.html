<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healix AI | Precision Medical Intelligence</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); }
        
        
        
        /* High Risk (Red Pulse) */
        .risk-high-box { 
            background-color: #fee2e2 !important; 
            border: 3px solid #ef4444 !important; 
            animation: pulse-red 1.5s infinite !important; 
        }
        .text-danger-bold { color: #991b1b !important; font-weight: 800 !important; }
        .label-danger { color: #b91c1c !important; font-weight: 600 !important; }
        
        /* Low Risk (Green Solid) */
        .bg-green-50 { background-color: #f0fdf4 !important; }
        .border-green-500 { border: 3px solid #22c55e !important; }
        .text-green-700 { color: #15803d !important; }
        .text-green-600 { color: #16a34a !important; }

        @keyframes pulse-red {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { transform: scale(1.02); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        #insights-panel { animation: slideUp 0.6s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 font-['Plus_Jakarta_Sans'] text-slate-900">
    <nav class="p-6 flex justify-between items-center max-w-4xl mx-auto">
        <div class="flex items-center gap-2 cursor-pointer" onclick="location.href='/'">
            <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">H</div>
            <span class="text-2xl font-bold tracking-tight text-indigo-900">Healix AI</span>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-6 py-12 space-y-8">
        <div class="glass-panel p-8 rounded-3xl border border-white/50 shadow-xl bg-white/50">
            <h2 class="text-2xl font-bold mb-2">Prescription Analyzer</h2>
            <p class="text-slate-500 mb-8">AI interpretation with instant ordering.</p>
            
            <div id="drop-zone" class="border-2 border-dashed border-indigo-200 rounded-2xl p-12 text-center bg-indigo-50/50 hover:bg-indigo-50 transition-colors cursor-pointer group">
                <input type="file" id="file-input" class="hidden" accept="image/*">
                <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm group-hover:scale-110 transition-transform">
                    <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                </div>
                <p id="file-name" class="font-semibold text-indigo-900">Click to upload image</p>
                <p class="text-sm text-slate-400 mt-1">PNG, JPG or WEBP (Max 10MB)</p>
            </div>

            <button onclick="analyzePrescription()" id="analyze-btn" class="w-full mt-6 bg-slate-900 text-white py-4 rounded-xl font-bold hover:bg-black transition-all">Analyze & Order</button>
        </div>

        <div id="insights-panel" class="hidden space-y-6">
            <div class="glass-panel p-8 rounded-3xl border border-white/50 shadow-xl bg-white/95">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold text-indigo-900">Medical Analysis</h3>
                    <button onclick="speakResults(analysisResultText)" class="p-2 bg-indigo-100 rounded-full text-indigo-600">🔊</button>
                </div>
                
                <div id="analysis-content" class="text-slate-700 leading-relaxed mb-8 prose prose-indigo max-w-none"></div>

                <div id="order-section" class="mb-8 hidden p-4 bg-indigo-50 rounded-2xl border border-indigo-100">
                    <h4 class="text-indigo-900 text-xs font-bold uppercase mb-3 tracking-widest">📦 Order on PharmEasy</h4>
                    <div id="medicine-links" class="flex flex-wrap gap-2"></div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                    <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                        <h4 class="text-emerald-800 text-xs font-bold uppercase mb-2">✅ Take</h4>
                        <ul id="foods-take" class="text-sm text-emerald-900 space-y-1 list-disc pl-4"></ul>
                    </div>
                    <div class="bg-rose-50 p-4 rounded-2xl border border-rose-100">
                        <h4 class="text-rose-800 text-xs font-bold uppercase mb-2">❌ Avoid</h4>
                        <ul id="foods-avoid" class="text-sm text-rose-900 space-y-1 list-disc pl-4"></ul>
                    </div>
                </div>

                <div class="pt-6 border-t border-slate-100 grid grid-cols-2 gap-4">
                    <div class="bg-emerald-50 p-4 rounded-2xl">
                        <p class="text-emerald-700 text-xs font-bold mb-1">Savings</p>
                        <p class="text-2xl font-bold text-emerald-900">70%</p>
                    </div>
                    <div id="risk-card" class="bg-amber-50 p-4 rounded-2xl transition-all">
                        <p id="risk-label" class="text-amber-700 text-xs font-bold mb-1">Safety Risk</p>
                        <p id="risk-text" class="text-2xl font-bold text-amber-900">Low</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="/static/scripts.js"></script>
</body>
</html>
