<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healix MD | S.O.A.P. Drafter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #1e293b; }
        .soap-container { background: white; border-radius: 2.5rem; box-shadow: 0 25px 60px -15px rgba(0,0,0,0.06); }
        .clinical-input { border: 1.5px solid #e2e8f0; border-radius: 16px; padding: 1.25rem; width: 100%; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); background: #fff; resize: none; }
        .clinical-input:focus { border-color: #6366f1; outline: none; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.08); }
        
        .loading-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

        .drop-zone--over { border-color: #6366f1; background: #f5f7ff; }
        
        @media print { 
            .no-print { display: none !important; } 
            body { background: white; padding: 0; } 
            .soap-container { box-shadow: none; border: 1px solid #eee; width: 100%; max-width: 100%; margin: 0; }
            .clinical-input { border: none; padding: 0; background: transparent; }
        }
    </style>
</head>
<body class="p-4 md:p-10">
    
    <nav class="max-w-7xl mx-auto flex justify-between items-center mb-10 no-print">
        <div class="flex items-center gap-3 cursor-pointer" onclick="location.href='/'">
            <div class="w-10 h-10 bg-slate-900 rounded-2xl flex items-center justify-center text-white font-black text-xl shadow-lg">H</div>
            <h1 class="text-xl font-extrabold tracking-tight italic">Healix <span class="text-indigo-600">MD</span></h1>
        </div>
        <div class="flex gap-4">
            <button onclick="window.print()" class="bg-indigo-600 text-white px-8 py-3 rounded-2xl font-bold text-sm shadow-xl shadow-indigo-100 hover:bg-indigo-700 transition-all flex items-center gap-2">
                Export / Print
            </button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto grid lg:grid-cols-12 gap-10">
        
        <aside class="lg:col-span-4 no-print space-y-6">
            <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100">
                <h3 class="text-xl font-extrabold text-slate-900 mb-6">Clinical Console</h3>
                
                <div class="space-y-6">
                    <div>
                        <label class="text-[10px] font-black text-indigo-600 uppercase tracking-widest mb-2 block">1. Patient History (S)</label>
                        <textarea id="symptomsInput" rows="4" class="clinical-input text-sm" placeholder="Chief complaints..."></textarea>
                    </div>

                    <div>
                        <label class="text-[10px] font-black text-indigo-600 uppercase tracking-widest mb-2 block">2. Clinical Evidence (O)</label>
                        <div id="dropZone" class="border-2 border-dashed border-slate-200 rounded-2xl p-6 text-center transition-all bg-slate-50/50 relative">
                            <input type="file" id="medicalFiles" multiple class="hidden">
                            <label for="medicalFiles" class="cursor-pointer block">
                                <div id="uploadText" class="text-indigo-600 font-bold text-sm">Click to select files</div>
                                <div id="fileCount" class="text-[10px] text-slate-400 mt-1 font-bold">0 Files attached</div>
                            </label>
                        </div>
                    </div>

                    <button onclick="generateSOAP()" id="mainBtn" class="w-full mt-4 py-5 bg-slate-900 text-white font-black rounded-2xl hover:bg-indigo-600 transition-all shadow-xl flex items-center justify-center gap-3">
                        <span>GENERATE SOAP NOTE</span>
                    </button>
                </div>
            </div>

            <div class="bg-indigo-600 p-8 rounded-[2.5rem] text-white">
                <p class="text-xs leading-relaxed font-bold italic opacity-90">"Healix uses docTR Vision to extract lab values and cross-references MSF protocols via RAG."</p>
            </div>
        </aside>

        <main class="lg:col-span-8 soap-container p-10 md:p-16 relative">
            <div id="loadingOverlay" class="hidden absolute inset-0 bg-white/90 backdrop-blur-md z-10 flex flex-col items-center justify-center rounded-[2.5rem]">
                <div class="w-16 h-16 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mb-4"></div>
                <p class="font-black text-slate-900 uppercase tracking-widest text-xs loading-pulse">Processing Multi-File RAG...</p>
            </div>

            <div class="border-b-2 border-slate-100 pb-8 mb-10 flex justify-between items-end">
                <div>
                    <h2 class="text-4xl font-black text-slate-900 tracking-tight">SOAP Note</h2>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-2">Verified Clinical Draft</p>
                </div>
                <div class="text-right">
                    <p class="text-lg font-bold text-slate-900" id="current-date"></p>
                </div>
            </div>

            <div class="space-y-10">
                <section>
                    <label class="section-tag bg-indigo-50 text-indigo-600 mb-3 block w-fit">Subjective</label>
                    <textarea id="section_S" class="clinical-input text-slate-600 italic" rows="3"></textarea>
                </section>

                <section>
                    <label class="section-tag bg-emerald-50 text-emerald-600 mb-3 block w-fit">Objective (Biomarkers)</label>
                    <textarea id="section_O" class="clinical-input font-mono text-xs text-emerald-800 bg-emerald-50/20" rows="5"></textarea>
                </section>

                <section>
                    <label class="section-tag bg-rose-50 text-rose-600 mb-3 block w-fit">Assessment</label>
                    <textarea id="section_A" class="clinical-input font-bold" rows="2"></textarea>
                </section>

                <section>
                    <label class="section-tag bg-amber-50 text-amber-600 mb-3 block w-fit">Plan</label>
                    <textarea id="section_P" class="clinical-input" rows="4"></textarea>
                </section>
            </div>
        </main>
    </div>

    <script>
    // Set current date
    document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-GB', {
        day: '2-digit', month: 'short', year: 'numeric'
    });

    const fileInput = document.getElementById('medicalFiles');
    const uploadBox = fileInput.parentElement;
    const uploadText = document.getElementById('uploadText');
    const fileCountDisp = document.getElementById('fileCount');

    fileInput.addEventListener('change', () => {
        const count = fileInput.files.length;
        if (count > 0) {
            uploadBox.classList.add('bg-emerald-50/50', 'border-emerald-400');
            uploadText.innerHTML = `✅ ${count} File(s) Selected`;
            uploadText.className = "text-emerald-700 font-bold text-sm";
            fileCountDisp.innerText = "Ready for RAG Analysis";
        }
    });

    async function generateSOAP() {
        const btn = document.getElementById('mainBtn');
        const overlay = document.getElementById('loadingOverlay');
        const symptoms = document.getElementById('symptomsInput').value;
        const files = fileInput.files;

        if (!symptoms && files.length === 0) {
            return alert("Please input symptoms or upload a clinical file.");
        }

        const formData = new FormData();
        formData.append('symptoms', symptoms);
        for (let i = 0; i < files.length; i++) {
            formData.append('files', files[i]);
        }

        btn.disabled = true;
        btn.innerHTML = `<span>Analyzing Evidence...</span>`;
        overlay.classList.remove('hidden');

        try {
            const response = await fetch('/api/generate-soap/', { method: 'POST', body: formData });
            const data = await response.json();

            if (data.status === 'success') {
                const text = data.soap;

                // --- NEW AGGRESSIVE PARSER ---
                // This looks for S/Subjective, O/Objective, A/Assessment, P/Plan
                // even if they have ** bolding or extra spaces.
                const extractSection = (patterns) => {
                    for (let pattern of patterns) {
                        const match = text.match(pattern);
                        if (match && match[1]) return match[1].trim().replace(/\*/g, '');
                    }
                    return null;
                };

                const sections = {
                    s: extractSection([
                        /(?:S|Subjective)\s*:\s*([\s\S]*?)(?=(?:O|Objective|A|Assessment|P|Plan)\s*:|$)/i,
                        /\*\*S\*\*:\s*([\s\S]*?)(?=\*\*O\*\*|\*\*A\*\*|\*\*P\*\*|$)/i
                    ]) || "Reviewing patient history...",
                    
                    o: extractSection([
                        /(?:O|Objective)\s*:\s*([\s\S]*?)(?=(?:A|Assessment|P|Plan)\s*:|$)/i,
                        /\*\*O\*\*:\s*([\s\S]*?)(?=\*\*A\*\*|\*\*P\*\*|$)/i
                    ]) || "Extracting lab biomarkers...",
                    
                    a: extractSection([
                        /(?:A|Assessment)\s*:\s*([\s\S]*?)(?=(?:P|Plan)\s*:|$)/i,
                        /\*\*A\*\*:\s*([\s\S]*?)(?=\*\*P\*\*|$)/i
                    ]) || "Performing clinical reasoning...",
                    
                    p: extractSection([
                        /(?:P|Plan)\s*:\s*([\s\S]*?)$/i,
                        /\*\*P\*\*:\s*([\s\S]*?)$/i
                    ]) || "Drafting treatment protocols..."
                };

                // If the regex failed completely, just put the whole text in S for the user to see
                if (sections.s.length < 10 && text.length > 50) {
                    document.getElementById('section_S').value = text;
                } else {
                    document.getElementById('section_S').value = sections.s;
                    document.getElementById('section_O').value = sections.o;
                    document.getElementById('section_A').value = sections.a;
                    document.getElementById('section_P').value = sections.p;
                }

                // Visual success flash
                ['section_S', 'section_O', 'section_A', 'section_P'].forEach(id => {
                    const el = document.getElementById(id);
                    el.classList.add('ring-4', 'ring-indigo-100');
                    setTimeout(() => el.classList.remove('ring-4', 'ring-indigo-100'), 2000);
                });

            }
        } catch (error) {
            alert("Connection Error. Check your Django server.");
        } finally {
            btn.disabled = false;
            btn.innerHTML = `<span>GENERATE SOAP NOTE</span>`;
            overlay.classList.add('hidden');
        }
    }
</script>
</body>
</html>
